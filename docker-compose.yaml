services:
    ollama:
        image: ollama/ollama:latest
        container_name: ollama
        restart: always
        user: "1012:1012"
        ports:
            - "127.0.0.1:11434:11434"
        environment:
            - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
            - OLLAMA_NUMA=true
            - HOME=/tmp
        volumes:
            - ollama_vol:/tmp/.ollama

    open-webui:
        image: ghcr.io/open-webui/open-webui:main
        container_name: open-webui
        restart: always
        ports:
            - "127.0.0.1:3388:8080"
        environment:
            - OLLAMA_BASE_URL=http://ollama:11434
            - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
        volumes:
            - webui_vol:/app/backend/data
        depends_on:
            - ollama

volumes:
  ollama_vol:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './ollama-models'

  webui_vol:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './open-webui/data'
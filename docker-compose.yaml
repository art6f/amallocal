services:
    llamacpp-server:
        image: ghcr.io/ggml-org/llama.cpp:server
        #build:
            #context: llama-cpp/docker
            #dockerfile: Dockerfile
        container_name: llamacpp-server
        environment:
            - HF_TOKEN=${HUGFACE_TOKEN}
            - LLAMA_CACHE=/models/.cache
            - LLAMA_ARG_CTX_SIZE=${LLAMA_CONTEXT_SIZE:-0}
            - LLAMA_ARG_THREADS=${LLAMA_CPU_CORES:-1}
            
            # models
            - LLAMA_ARG_HF_REPO=${HUGFACE_REPO}
            - LLAMA_ARG_HF_FILE=${HUGFACE_FILE}
            - LLAMA_ARG_ALIAS=${LLAMA_MODEL_ALIAS}

            # fine-tune
            - LLAMA_ARG_MLOCK=false
            - LLAMA_ARG_BATCH=${LLAMA_LOGICAL_BATCH}
            - LLAMA_ARG_UBATCH=${LLAMA_PHYSICAL_BATCH}

        volumes:
          - llamacpp_volume:/models
        
        healthcheck:
            test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8080/"]
            interval: 30s
            timeout: 30s
            retries: 3
            start_period: 10s

    open-webui:
        image: ghcr.io/open-webui/open-webui:v0.9.6
        container_name: open-webui
        restart: always
        ports:
            - "${WEBUI_HOST:-127.0.0.1}:${WEBUI_PORT}:8080"
        environment:
            - USER_AGENT=openwebui/docker
            - ENABLE_OLLAMA_API=false
            - OPENAI_API_BASE_URL=http://llamacpp-server:8080/v1
            - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
        
            - DEFAULT_MODEL=${LLAMA_MODEL_ALIAS}
            - SHOW_ADMIN_DETAILS=false

            # integration
            - ENABLE_API_KEYS=true

        volumes:
            - webui_volume:/app/backend/data
        
        healthcheck:
            test: ["CMD", "curl", "-s", "-o", "/dev/null", "-f", "http://localhost:8080/"]
            interval: 30s
            timeout: 30s
            retries: 3
            start_period: 10s

        depends_on:
            - llamacpp-server

volumes:
  llamacpp_volume:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './llama-cpp/models'

  webui_volume:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './open-webui/data'
